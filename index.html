<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIN CARD Dashboard Live</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:Segoe UI,sans-serif;background:#f4f7fb;margin:0;padding:20px;color:#1e293b}
.container{max-width:1300px;margin:auto}
h1{margin:0}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 3px 12px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:20px}
.stat{font-size:28px;font-weight:bold}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}
input,select,button{padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px}
button{background:#2563eb;color:white;border:none;cursor:pointer}
button:hover{background:#1d4ed8}
table{width:100%;border-collapse:collapse;background:white;border-radius:10px;overflow:hidden}
th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left}
th{background:#e2e8f0}
.badge{padding:4px 8px;border-radius:5px;color:white;font-size:12px}
.in{background:#16a34a}
.out{background:#dc2626}
.section{margin-top:20px}
.scroll{max-height:350px;overflow:auto}
canvas{max-height:300px; width:100% !important;}
#error{color:#2563eb;margin:10px 0;font-weight:bold}
.card.info { border-left: 5px solid #2563eb; }
</style>
</head>
<body>
<div class="container">

<div class="header">
<div>
<h1>📦 BIN CARD Dashboard Live</h1>
<div>Adaro Persada Mandiri - MK</div>
</div>
</div>

<div class="card controls">
<input id="searchInput" placeholder="Cari nama barang..." onkeyup="applyFilters()">
<input type="month" id="monthFilter" onchange="applyFilters()">
<!-- Filter Lokasi -->
<select id="locationFilter" onchange="applyFilters()">
    <option value="">Semua Lokasi</option>
</select>
<button onclick="showAllBarang()">Semua Barang</button>
<button onclick="downloadCSV()">Download CSV</button>
<button onclick="loadData()" style="background:#1e293b;">Refresh Data</button>
</div>

<div id="error">Sedang memuat data...</div>

<!-- Kartu Total Masuk, Keluar, Saldo Akhir telah dihapus sesuai permintaan -->
<div class="grid">
    <div class="card info"><div>Rata-rata Keluar/Hari</div><div class="stat" id="avgDay">0</div></div>
    <div class="card info"><div>Rata-rata Keluar/Minggu</div><div class="stat" id="avgWeek">0</div></div>
    <div class="card info"><div>Rata-rata Keluar/Bulan</div><div class="stat" id="avgMonth">0</div></div>
</div>

<div class="grid">
<div class="card">
<h3>Tren Aktivitas Stok (Masuk vs Keluar)</h3>
<!-- Canvas untuk Line Chart -->
<canvas id="lineChart"></canvas>
</div>

<div class="card">
<h3>Saldo Akhir per Barang</h3>
<div class="scroll">
<table>
<thead><tr><th>Barang</th><th>Masuk</th><th>Keluar</th><th>Saldo</th></tr></thead>
<tbody id="saldoBody"></tbody>
</table>
</div>
</div>
</div>

<div class="section card">
<h3>Log Transaksi</h3>
<div class="scroll">
<table>
<thead>
<tr>
<th>Tanggal</th>
<th>Barang</th>
<th>Tipe</th>
<th>Jumlah</th>
<th>Keterangan</th>
<th>Lokasi</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>
</div>

</div>

<script>
// ID Google Sheet Anda
const SPREADSHEET_ID = "1RzitZC9jifvgtblHDbWxvxK5mge8U0JLpH2HxmAlPWM"; 

let allRows=[];
let chart=null; // Variabel chart diubah menjadi line chart
let filterTimeout=null;

window.onload = function() {
  loadData();
};

function loadData(){
 if(!SPREADSHEET_ID || SPREADSHEET_ID.includes("GANTI_DENGAN")){
    document.getElementById('error').innerText='Error: ID Google Sheet belum dimasukkan ke dalam kode script.';
    return;
 }
 document.getElementById('error').innerText='Sedang sinkronisasi data cloud...';
 let old=document.getElementById('jsonp');
 if(old) old.remove();
 let s=document.createElement('script');
 s.id='jsonp';
 s.src='https://docs.google.com/spreadsheets/d/'+SPREADSHEET_ID+'/gviz/tq?gid=0&tqx=responseHandler:handleData';
 document.body.appendChild(s);
}

Date.prototype.getWeekNumber = function() {
    var d = new Date(Date.UTC(this.getFullYear(), this.getMonth(), this.getDate()));
    var dayNum = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - dayNum);
    var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
    return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
};

window.handleData = function(res){
 try{
  allRows=[];
  let rows=res.table.rows;
  
  if(!rows || rows.length === 0){
    document.getElementById('error').innerText='Data kosong atau tidak ditemukan.';
    return;
  }

  document.getElementById('error').innerText='';
  let tempRows = [];
  
  // Set untuk menyimpan daftar lokasi unik
  let uniqueLocations = new Set();

  rows.forEach(r=>{
   let tanggalRaw= r.c[0] ? (r.c[0].f || r.c[0].v || '') : '';
   let nama= r.c[1] ? (r.c[1].v || '').toString().trim() : '';
   let jenis= r.c[2] ? (r.c[2].v || '').toString().trim() : '';
   let jumlah= r.c[3] ? parseFloat(r.c[3].v || 0) : 0;
   let ket= r.c[4] ? (r.c[4].v || '').toString().trim() : '';
   let lokasi= r.c[5] ? (r.c[5].v || '').toString().trim() : '';

   if(!nama && !tanggalRaw && !jenis) return;

   // Tambahkan lokasi ke daftar set jika ada
   if(lokasi) uniqueLocations.add(lokasi);

   let year = null;
   let month = null; 
   let day = null;
   let week = null;
   let dateObj = null;

   let mSlash = String(tanggalRaw).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
   let mDash = String(tanggalRaw).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);

   if (mSlash) {
      day = parseInt(mSlash[1]);
      month = parseInt(mSlash[2]);
      year = parseInt(mSlash[3]);
      dateObj = new Date(year, month - 1, day);
   } else if (mDash) {
      year = parseInt(mDash[1]);
      month = parseInt(mDash[2]);
      day = parseInt(mDash[3]);
      dateObj = new Date(year, month - 1, day);
   } else {
      let d = new Date(tanggalRaw);
      if (!isNaN(d.getTime())) {
         year = d.getFullYear();
         month = d.getMonth() + 1;
         day = d.getDate();
         dateObj = d;
      }
   }

   if(dateObj && !isNaN(dateObj.getTime())){
       week = dateObj.getWeekNumber();
   }

   let searchText=(tanggalRaw+' '+nama+' '+jenis+' '+ket+' '+jumlah+' '+lokasi).toLowerCase();
   
   tempRows.push({
       tanggal: tanggalRaw, 
       nama, 
       jenis, 
       jumlah, 
       ket, 
       lokasi, 
       month, 
       year, 
       day, 
       week,
       dateObj,
       searchText
   });
  });

  allRows = tempRows;
  
  // Populate Location Filter Dropdown
  let locSelect = document.getElementById('locationFilter');
  // Hapus op lama kecuali opsi default
  while (locSelect.options.length > 1) {
    locSelect.remove(1);
  }
  // Tambahkan opsi lokasi baru
  [...uniqueLocations].sort().forEach(loc => {
     let option = document.createElement('option');
     option.value = loc;
     option.text = loc;
     locSelect.appendChild(option);
  });

  applyFilters();

 }catch(e){
  console.log(e);
  document.getElementById('error').innerText='Gagal membaca data dari Google Sheet. Cek kembali setelan Share link Anda.';
 }
}

function applyFilters(){
 clearTimeout(filterTimeout);
 filterTimeout = setTimeout(() => {
    let search=document.getElementById('searchInput').value.trim().toLowerCase();
    let monthInput=document.getElementById('monthFilter').value;
    let locInput=document.getElementById('locationFilter').value; 

    let data=allRows.filter(r=>{
        let okSearch = !search || (r.searchText || '').includes(search);
        let okMonth = true;
        let okLoc = true; 

        if(monthInput){
            let parts=monthInput.split('-');
            let filterYear=parseInt(parts[0]);
            let filterMonth=parseInt(parts[1]);
            okMonth=(r.year === filterYear && r.month === filterMonth);
        }
        
        if(locInput){
            okLoc = (r.lokasi === locInput);
        }

        return okSearch && okMonth && okLoc;
    });

    render(data);
 }, 150);
}

function render(data){
 let tbody=document.getElementById('tbody');
 let saldoBody=document.getElementById('saldoBody');

 // Variabel untuk statistik
 let masuk=0, keluar=0;
 let saldoBarang={};
 
 let keluarTotalJumlah = 0;
 let uniqueDays = new Set();
 let uniqueWeeks = new Set();
 let uniqueMonths = new Set();

 // Variabel untuk Line Chart (Grouping Data per Tanggal)
 let chartDataMap = {}; 

 let tbodyHtml = [];
 let saldoHtml = [];

 data.forEach(r=>{
  let jenis=(r.jenis||'').toLowerCase().trim();
  let barang=(r.nama||'').toString().trim();

  // Akumulasi total untuk statistik kartu
  if(jenis==='masuk') masuk+=Number(r.jumlah)||0;
  if(jenis==='keluar') {
      let jumlahKeluar = Number(r.jumlah)||0;
      keluar+=jumlahKeluar;
      
      keluarTotalJumlah += jumlahKeluar;
      if(r.year && r.month && r.day) uniqueDays.add(`${r.year}-${r.month}-${r.day}`);
      if(r.year && r.week) uniqueWeeks.add(`${r.year}-${r.week}`);
      if(r.year && r.month) uniqueMonths.add(`${r.year}-${r.month}`);
  }

  // Proses untuk Saldo Barang
  if(barang){
    if(!saldoBarang[barang]){
      saldoBarang[barang]={masuk:0,keluar:0};
    }
    if(jenis==='masuk'){
      saldoBarang[barang].masuk += Number(r.jumlah)||0;
    }
    if(jenis==='keluar'){
      saldoBarang[barang].keluar += Number(r.jumlah)||0;
    }
  }

  // Proses untuk Line Chart (Grouping Harian)
  if(r.dateObj){
      // Format Key: YYYY-MM-DD untuk sorting
      let dateKey = r.dateObj.toISOString().split('T')[0]; 
      if(!chartDataMap[dateKey]){
          chartDataMap[dateKey] = { masuk: 0, keluar: 0 };
      }
      if(jenis==='masuk') chartDataMap[dateKey].masuk += Number(r.jumlah)||0;
      if(jenis==='keluar') chartDataMap[dateKey].keluar += Number(r.jumlah)||0;
  }

  tbodyHtml.push(`
  <tr>
  <td>${r.tanggal}</td>
  <td>${barang}</td>
  <td><span class="badge ${jenis==='masuk'?'in':'out'}">${r.jenis}</span></td>
  <td>${r.jumlah}</td>
  <td>${r.ket}</td>
  <td>${r.lokasi}</td>
  </tr>`);
 });

 Object.keys(saldoBarang).sort().forEach(b=>{
    let s=saldoBarang[b];
    let saldo=(s.masuk-s.keluar);

    saldoHtml.push(`
    <tr>
      <td>${b}</td>
      <td>${s.masuk}</td>
      <td>${s.keluar}</td>
      <td><b>${saldo}</b></td>
    </tr>`);
 });

 tbody.innerHTML = tbodyHtml.join('');
 saldoBody.innerHTML = saldoHtml.join('');

 // Update Kartu Statistik
 let avgDayVal = 0;
 let avgWeekVal = 0;
 let avgMonthVal = 0;

 if(uniqueDays.size > 0) avgDayVal = keluarTotalJumlah / uniqueDays.size;
 if(uniqueWeeks.size > 0) avgWeekVal = keluarTotalJumlah / uniqueWeeks.size;
 if(uniqueMonths.size > 0) avgMonthVal = keluarTotalJumlah / uniqueMonths.size;

 document.getElementById('avgDay').innerText = avgDayVal.toFixed(1);
 document.getElementById('avgWeek').innerText = avgWeekVal.toFixed(1);
 document.getElementById('avgMonth').innerText = avgMonthVal.toFixed(1);

 // Panggil fungsi menggambar Line Chart
 drawLineChart(chartDataMap);
}

function drawLineChart(dataMap){
    // 1. Urutkan tanggal
    let sortedDates = Object.keys(dataMap).sort((a, b) => new Date(a) - new Date(b));
    
    // 2. Logika Filter 3 Bulan Terakhir
    let monthInput = document.getElementById('monthFilter').value;
    let labels = [];
    let dataMasuk = [];
    let dataKeluar = [];

    // Jika tidak ada filter bulan spesifik, potong data untuk 3 bulan terakhir
    let cutoffDate = null;
    if (!monthInput && sortedDates.length > 0) {
        let lastDate = new Date(sortedDates[sortedDates.length - 1]);
        cutoffDate = new Date(lastDate);
        cutoffDate.setMonth(cutoffDate.getMonth() - 3); // Mundur 3 bulan
    }

    sortedDates.forEach(dateStr => {
        let d = new Date(dateStr);
        
        // Jika ada cutoff date (mode 3 bulan terakhir), lewati tanggal yang lebih lama
        if (cutoffDate && d < cutoffDate) {
            return;
        }

        // Format Label (DD/MM)
        let parts = dateStr.split('-'); // YYYY-MM-DD
        let label = `${parts[2]}/${parts[1]}`; // DD/MM
        
        labels.push(label);
        dataMasuk.push(dataMap[dateStr].masuk);
        dataKeluar.push(dataMap[dateStr].keluar);
    });

    // 3. Render Chart
    let ctx = document.getElementById('lineChart').getContext('2d');
    if(chart) chart.destroy();
    
    chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [
                {
                    label: 'Masuk',
                    data: dataMasuk,
                    borderColor: '#16a34a', // Hijau
                    backgroundColor: 'rgba(22, 163, 74, 0.1)',
                    fill: true,
                    tension: 0.4 // Membuat garis melengkung sedikit
                },
                {
                    label: 'Keluar',
                    data: dataKeluar,
                    borderColor: '#dc2626', // Merah
                    backgroundColor: 'rgba(220, 38, 38, 0.1)',
                    fill: true,
                    tension: 0.4
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true,
                    title: { display: true, text: 'Jumlah' }
                },
                x: {
                    title: { display: true, text: 'Tanggal' }
                }
            },
            plugins: {
                legend: { position: 'top' },
                tooltip: {
                    mode: 'index',
                    intersect: false
                }
            }
        }
    });
}

function showAllBarang(){
 document.getElementById('searchInput').value = '';
 document.getElementById('monthFilter').value = '';
 document.getElementById('locationFilter').value = ''; 
 render(allRows);
}

function downloadCSV(){
 let rows=[...document.querySelectorAll('#tbody tr')];
 let csv='Tanggal,Barang,Tipe,Jumlah,Keterangan,Lokasi\n';
 rows.forEach(r=>{
  let c=r.querySelectorAll('td');
  if(c.length){
   let lokasiText = c[5] ? c[5].innerText : '';
   csv+=`${c[0].innerText},${c[1].innerText},${c[2].innerText},${c[3].innerText},${c[4].innerText},${lokasiText}\n`;
  }
 });
 let blob=new Blob([csv],{type:'text/csv'});
 let a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='bincard.csv';
 a.click();
}
</script>
</body>
</html>
